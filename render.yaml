services:
  - type: web
    name: conversor-sped
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.main_internet:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STORAGE_ROOT
        value: storage
      - key: MAX_UPLOAD_MB
        value: 80
